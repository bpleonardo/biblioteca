[project]
name = "biblioteca"
version = "0.1.0"
description = "Sistema de Gerenciamento de Biblioteca com Django, DRF e PostgreSQL"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.1.0",
    "djangorestframework>=3.15.2",
    "django-filter>=24.3",
    "drf-spectacular>=0.28.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "apps"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "--reuse-db"
